<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apuntes</title>
  <script>
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" aria-label="Abrir menú">☰</button>
    <span id="topbar-title">Apuntes</span>
    <button id="progress-btn" class="progress-btn" aria-label="Progreso de lectura" title="Progreso de lectura">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <circle class="progress-bg" cx="18" cy="18" r="15.5"></circle>
        <circle class="progress-fg" cx="18" cy="18" r="15.5"></circle>
      </svg>
      <span id="progress-pct" class="progress-pct">0%</span>
    </button>
  </header>

  <div class="app">
    <aside id="sidebar">
      <div class="sb-head">
        <a class="brand" href="#/" id="brand">Apuntes</a>
        <button id="theme-btn" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
      </div>
      <input id="search" type="search" placeholder="Buscar nota…  ( / )" autocomplete="off">
      <nav id="nav"></nav>
    </aside>

    <main>
      <div id="crumbs" class="crumbs"></div>
      <article id="content" class="markdown"></article>
      <nav id="pager" class="pager"></nav>
    </main>

    <aside id="toc"></aside>
  </div>
  <div id="scrim"></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
